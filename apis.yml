aid: 8fig
name: 8fig
description: 8fig is an eCommerce growth platform and direct lender that provides continuous, revenue-based
  funding and cash-flow planning technology to online sellers on Amazon, Shopify, and other marketplaces.
  Founded in 2020 and headquartered in Miami, Florida (with R&D in Tel Aviv), 8fig offers funding of up
  to $10 million through its Growth Plan product, using proprietary AI-driven cash-flow modeling to align
  capital disbursements to a seller's supply-chain costs. 8fig also exposes an integration/partnership
  program that lets platforms embed its funding tools, though it does not publish a public developer
  portal or API reference.
